<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ملف المهمة</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--ink:#2d4a7a;--card:#f4f8fd;--line:#b7c9e4;--chip:#cfdcf2;--ic:#dfe8e0;--head1:#3a5c92;--head2:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121826;--ink:#c8d8f2;--card:#1c2639;--line:#3a4d70;--chip:#2c3e63;--ic:#2a3a4f;--head1:#1f3358;--head2:#121826}}
:root[data-theme="dark"]{--bg:#121826;--ink:#c8d8f2;--card:#1c2639;--line:#3a4d70;--chip:#2c3e63;--ic:#2a3a4f;--head1:#1f3358;--head2:#121826}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif}
header{background:linear-gradient(var(--head1),var(--head2));padding:28px 20px 40px;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;max-width:960px;margin:0 auto;direction:ltr;gap:12px;flex-wrap:wrap}
.big{font-size:clamp(28px,6vw,52px);font-weight:900;color:#1c2f57;line-height:1;text-align:left;font-family:Impact,"Arial Black",sans-serif;letter-spacing:1px}
.big span{display:inline-block;background:#bcd0f0;padding:4px 14px;font-size:.45em;margin-top:6px;font-family:Arial,sans-serif;letter-spacing:2px}
@media(prefers-color-scheme:dark){.big{color:#dbe7ff}}
.logos{font-weight:700;font-size:14px;text-align:center;color:#1c2f57;border:2px dashed var(--line);padding:10px 14px;border-radius:12px}
.title{display:inline-block;margin-top:20px;background:#fbf4e6;color:#2d4a7a;padding:8px 26px;border-radius:12px;font-weight:800;font-size:20px}
main{max-width:960px;margin:-10px auto 0;padding:20px 14px 40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px}
.card{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:6px 24px 6px 6px;padding:30px 12px 12px}
.tag{position:absolute;top:-12px;left:14px;direction:ltr;background:var(--bg);border:2px solid var(--ink);padding:1px 10px;font-weight:800;font-size:13px;transform:rotate(-4deg);font-family:Arial,sans-serif}
.row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ic{flex:none;width:40px;height:40px;border-radius:50%;background:var(--ic);display:grid;place-items:center;font-size:18px}
.f{flex:1;position:relative;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:18px 12px 8px;min-height:50px;font-size:14px;border-bottom:1px dashed var(--line)}
.f b{position:absolute;top:-9px;right:10px;background:var(--chip);color:var(--ink);font-size:11px;padding:1px 10px;border-radius:6px}
.f div{outline:none}
.f input{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;font-size:14px;outline:none;padding:0}
.f input::placeholder{color:#8aa0c4}
.dl{grid-column:1/-1;max-width:420px;margin:0 auto;width:100%}
#st{text-align:center;font-size:12px;opacity:.7;padding-bottom:20px}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logos" style="color: #bcd0f0;">مَنار العِلم EL MANAR</div>
    <div class="big">CONFIDENTIAL<br><span>TEAM MISSION</span></div>
  </div>
  <div class="title">☆ ملف المهمة ☆</div>
</header>
<main id="m"></main>
<div id="st"></div>
<script>
var missionDetails = [
  "شرح الشابتر الثاني",
  "ملخص الشابتر الثاني",
  "كويز الشابتر الثاني",
  "تدقيق شرح الشابتر الثاني",
  "تدقيق ملخص الشابتر الثاني",
  "تدقيق كويز الشابتر الثاني"
];

var rows=[
  ["🎯","رقم المهمة:",function(i){return "#0"+i}],
  ["📝","المطلوب:",function(i){return missionDetails[i-1]}],
  ["👤","المسؤول:",null]
];

var h="";
for(var i=1;i<=6;i++){
  h+='<section class="card"><div class="tag">MISSION #0'+i+'</div>';
  rows.forEach(function(r){
    h+='<div class="row"><div class="ic">'+r[0]+'</div><div class="f"><b>'+r[1]+'</b>';
    h+= r[2] ? '<div contenteditable="true">'+r[2](i)+'</div>' : '<input type="text" maxlength="40" data-m="m'+i+'" placeholder="اكتب/ي اسمك هنا">';
    h+='</div></div>';
  });
  h+='</section>';
}
h+='<section class="card dl"><div class="tag">DEADLINE</div><div class="row"><div class="ic">⏰</div><div class="f"><b>الموعد النهائي:</b><input type="text" maxlength="60" data-m="deadline" value="" placeholder="30 - 4 - 1448 هـ  |  11 - 10 - 2026 م"></div></div></section>';
document.getElementById("m").innerHTML=h;
var DEF="30 - 4 - 1448 هـ  |  11 - 10 - 2026 م";
var inputs=document.querySelectorAll("input[data-m]");
var st=document.getElementById("st");
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}}
inputs.forEach(function(el){var k=el.dataset.m;var v=ls(k);if(v)el.value=v;else if(k==="deadline")el.value=DEF});
(async function(){
  var db=null;
  try{db=await claude.use("db")}catch(e){}
  if(!db){st.textContent="الأسماء تنحفظ على جهازي ";inputs.forEach(function(el){el.addEventListener("change",function(){ls(el.dataset.m,el.value)})});return}
  st.textContent="الأسماء مشتركة وتتحدث مباشرة ✓";
  var col=db.collection("missions");
  inputs.forEach(function(el){
    el.addEventListener("change",function(){
      col.doc(el.dataset.m).set({v:el.value.trim()}).catch(function(){st.textContent="ما قدرت أحفظ — تأكدي أن عندك صلاحية التعديل"});
    });
  });
  col.onSnapshot(function(snap){
    snap.docs.forEach(function(d){
      var el=document.querySelector('input[data-m="'+d.id+'"]');
      var v=d.data()&&d.data().v;
      if(el&&typeof v==="string"&&document.activeElement!==el)el.value=v;
    });
  });
})();
</script>

<div style="text-align: center; margin: 20px; color: #fff;">
    <h3>سجل أسماء الفريق / الزوار</h3>
    <input type="text" id="userName" placeholder="اكتب اسمك هنا..." style="padding: 8px; border-radius: 5px; border: none; width: 200px; margin-left: 5px;">
    <button onclick="saveName()" style="padding: 8px 15px; border-radius: 5px; border: none; background: #00bcd4; color: #fff; cursor: pointer;">حفظ الاسم</button>
    
    <ul id="namesList" style="list-style: none; padding: 0; margin-top: 15px;">
        <!-- ستظهر الأسماء هنا تلقائياً -->
    </ul>
</div>

<script>
    const apiUrl = 'https://sheetdb.io/api/v1/imceb02ne6xkh';
  
    function saveName() {
        const nameInput = document.getElementById('userName').value;
        if (!nameInput) {
            alert('الرجاء كتابة الاسم أولاً!');
            return;
        }

        fetch(apiUrl, {
            method: 'POST',
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                data: { name: nameInput }
            })
        })
        .then(response => response.json())
        .then(data => {
            alert('تم حفظ الاسم بنجاح!');
            document.getElementById('userName').value = '';
            loadNames(); // تحديث القائمة مباشرة
        })
        .catch(error => console.error('Error:', error));
    }

    // دالة لجلب وعرض الأسماء لكل الزوار
    function loadNames() {
        fetch(apiUrl)
        .then(response => response.json())
        .then(data => {
            const list = document.getElementById('namesList');
            list.innerHTML = '';
            data.forEach(row => {
                if(row.name) {
                    const li = document.createElement('li');
                    li.textContent = row.name;
                    li.style.margin = '5px 0';
                    li.style.background = 'rgba(255,255,255,0.1)';
                    li.style.padding = '5px';
                    li.style.borderRadius = '4px';
                    list.appendChild(li);
                }
            });
        });
    }

    window.onload = loadNames;
</script>

</body>
</html>
